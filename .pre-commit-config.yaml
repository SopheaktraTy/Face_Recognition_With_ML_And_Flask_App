repos:
  - repo: https://github.com/alessandrojcm/commitlint-pre-commit-hook
    rev: v9.16.0
    hooks:
      - id: commitlint
        stages: [commit-msg]
        additional_dependencies:
          - "@commitlint/config-conventional"

  - repo: https://github.com/commitizen-tools/commitizen
    rev: v3.26.0 # latest version
    hooks:
      - id: commitizen
        stages: [commit-msg]
